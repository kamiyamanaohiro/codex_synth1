<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Psychedelic Groove Box</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<h1>Psychedelic Groove Box</h1>
<div id="controls">
  <button id="start">Start</button>
  <button id="stop">Stop</button>
</div>
<div class="module" id="drum">
  <h2>909 Drum Machine</h2>
  <div class="steps" id="drumSteps"></div>
</div>
<div class="module" id="ms10">
  <h2>MS10 Synth</h2>
  <div class="steps" id="ms10Steps"></div>
</div>
<div class="module" id="cs01">
  <h2>CS01 Bass</h2>
  <div class="steps" id="cs01Steps"></div>
</div>
<script src="app.js"></script>
</body>
</html>
